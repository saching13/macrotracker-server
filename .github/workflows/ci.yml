name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - name: OpenAPI document is up to date
        run: pnpm gen:openapi && git diff --exit-code openapi.json
      - name: Migrations match the schema
        run: |
          cd apps/api && pnpm exec drizzle-kit check

  integration:
    name: Integration tests (Postgres + GoTrue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start database and auth
        run: docker compose -p mt-test --env-file .env.test up -d --wait db auth
      - name: Run integration tests
        run: docker compose -p mt-test --env-file .env.test run --rm node sh -c 'pnpm install --frozen-lockfile && pnpm test:int'
      - name: Service logs on failure
        if: failure()
        run: docker compose -p mt-test --env-file .env.test logs db auth

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
