name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - name: OpenAPI document and web client are up to date
        run: |
          pnpm gen:openapi && pnpm --filter @macrotracker/web gen:api
          git diff --exit-code openapi.json apps/web/src/api/schema.d.ts
      - name: Migrations match the schema
        run: |
          cd apps/api && pnpm exec drizzle-kit check

  integration:
    name: Integration tests (Postgres + GoTrue)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start database and auth
        run: docker compose -p mt-test --env-file .env.test up -d --wait db auth
      - name: Run integration tests
        run: docker compose -p mt-test --env-file .env.test run --rm node sh -c 'pnpm install --frozen-lockfile && pnpm test:int'
      - name: Service logs on failure
        if: failure()
        run: docker compose -p mt-test --env-file .env.test logs db auth

  e2e:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/e2e.sh
      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  restore-drill:
    name: Backup and restore drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/restore-drill.sh

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
